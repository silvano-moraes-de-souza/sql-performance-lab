[project]
name = "sql-performance-lab"
version = "0.1.0"
description = "Slow PostgreSQL queries, the fix for each, and EXPLAIN ANALYZE before and after"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Silvano Moraes de Souza" }]
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2",
    "pyarrow>=16",
    "shopflow-datagen",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "psutil>=6.0",
    "matplotlib>=3.9",
    "pgserver>=0.1 ; python_full_version < '3.13'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sql_performance_lab"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PL"]
ignore = ["PLR0913", "PLR2004"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --cov=sql_performance_lab --cov-report=term-missing"

[tool.uv.sources]
shopflow-datagen = { git = "https://github.com/silvano-moraes-de-souza/shopflow-datagen" }

[project.scripts]
sqllab = "sql_performance_lab.cli:main"

[tool.ruff.lint.per-file-ignores]
# Long lines here are SQL strings.
"src/sql_performance_lab/cases.py" = ["E501"]
"src/sql_performance_lab/cli.py" = ["E501"]
"tests/*" = ["E501"]
"bench/run.py" = ["E501"]
