<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="SQL Performance Lab: Slow PostgreSQL queries, the fix for each, and EXPLAIN ANALYZE before and after">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1016"/><stop offset="1" stop-color="#111a24"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ef4444"/><stop offset="0.45" stop-color="#f5fbff"/>
      <stop offset="0.55" stop-color="#f5fbff"/><stop offset="1" stop-color="#ef4444"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0; 1 0" dur="4.5s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ef4444" stop-opacity="0.30"/><stop offset="1" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1b2430" stroke-width="1"/>
    </pattern>
    <style>
      .sans { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; } .mono { font-family: ui-monospace, 'Cascadia Code', Consolas, 'Liberation Mono', monospace; }
      .pulse { animation: pulse 3s ease-in-out infinite; transform-origin: 1040px 180px; }
      @keyframes pulse { 0%, 100% { transform: scale(0.92); opacity: .65; } 50% { transform: scale(1.08); opacity: 1; } }
      .fade { opacity: 0; animation: fade 8s infinite; }
      @keyframes fade { 0% { opacity: 0; transform: translateY(8px); } 6% { opacity: 1; transform: none; } 88% { opacity: 1; } 96%, 100% { opacity: 0; } }
      .grow { transform-box: fill-box; transform-origin: bottom; animation: grow 8s ease-out infinite; }
      @keyframes grow { 0% { transform: scaleY(0); } 18% { transform: scaleY(1); } 88% { transform: scaleY(1); opacity: 1; } 96%, 100% { transform: scaleY(1); opacity: 0; } }
      .growx { transform-box: fill-box; transform-origin: left; animation: growx 8s ease-out infinite; }
      @keyframes growx { 0% { transform: scaleX(0); } 18% { transform: scaleX(1); } 88% { transform: scaleX(1); opacity: 1; } 96%, 100% { transform: scaleX(1); opacity: 0; } }
      .draw { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 8s ease-in-out infinite; }
      @keyframes draw { 0% { stroke-dashoffset: 1000; } 35% { stroke-dashoffset: 0; } 88% { stroke-dashoffset: 0; opacity: 1; } 96%, 100% { opacity: 0; } }
      .flow { stroke-dasharray: 6 8; animation: flow 1.4s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -28; } }
      .blink { animation: blink 1s steps(1) infinite; } @keyframes blink { 50% { opacity: 0; } }
      .d1 { animation-delay: .3s; } .d2 { animation-delay: .6s; } .d3 { animation-delay: .9s; }
      .d4 { animation-delay: 1.2s; } .d5 { animation-delay: 1.5s; } .d6 { animation-delay: 1.8s; }
      .d7 { animation-delay: 2.1s; } .d8 { animation-delay: 2.4s; } .d9 { animation-delay: 2.7s; }
    </style>
  </defs>
  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#grid)" opacity="0.55"/>
  <circle class="pulse" cx="1040" cy="180" r="175" fill="url(#glow)"/>
  <rect x="64" y="64" width="6" height="232" rx="3" fill="#ef4444"/>
  <text x="96" y="96" class="mono" font-size="16" fill="#ef4444" letter-spacing="2">30 DAYS · DAY 05</text>
  <text x="92" y="152" class="sans" font-size="65" font-weight="800" fill="url(#shine)">SQL Performance Lab</text>
  <text x="96" y="212" class="sans" font-size="20" fill="#9aa7b2">Slow PostgreSQL queries, the fix for each, and EXPLAIN ANALYZE</text><text x="96" y="238" class="sans" font-size="20" fill="#9aa7b2">before and after</text>
  <rect x="96" y="262" width="71" height="28" rx="14" fill="#161b22" stroke="#ef4444" stroke-opacity="0.45"/><text x="132" y="281" text-anchor="middle" class="mono" font-size="13" fill="#c9d1d9">Python</text><rect x="177" y="262" width="104" height="28" rx="14" fill="#161b22" stroke="#ef4444" stroke-opacity="0.45"/><text x="229" y="281" text-anchor="middle" class="mono" font-size="13" fill="#c9d1d9">PostgreSQL</text><rect x="291" y="262" width="79" height="28" rx="14" fill="#161b22" stroke="#ef4444" stroke-opacity="0.45"/><text x="331" y="281" text-anchor="middle" class="mono" font-size="13" fill="#c9d1d9">EXPLAIN</text>
  <g><rect x="850" y="44" width="380" height="272" rx="12" fill="#0d1117" stroke="#2a3542"/><text x="870" y="74" class="mono" font-size="12" fill="#8b949e">EXPLAIN (ANALYZE, BUFFERS)</text><text x="870" y="104" class="sans" font-size="13" font-weight="700" fill="#f85149">as written</text><text x="880" y="126" class="mono" font-size="12" fill="#e6edf3">-&gt; Sort</text><text x="896" y="146" class="mono" font-size="12" fill="#c9d1d9">-&gt; Seq Scan on orders</text><rect x="870" y="158" width="340" height="8" rx="4" fill="#1b2029"/><rect x="870" y="158" width="340" height="8" rx="4" fill="#f85149"><animate attributeName="width" values="0;340;340" keyTimes="0;0.9;1" dur="8s" repeatCount="indefinite"/></rect><text x="870" y="204" class="sans" font-size="13" font-weight="700" fill="#3fb950">with the fix</text><text x="880" y="226" class="mono" font-size="12" fill="#e6edf3">-&gt; Limit</text><text x="896" y="246" class="mono" font-size="12" fill="#c9d1d9">-&gt; Index Scan using orders_cust_time</text><rect x="870" y="258" width="340" height="8" rx="4" fill="#1b2029"/><rect x="870" y="258" width="340" height="8" rx="4" fill="#3fb950"><animate attributeName="width" values="0;340;340" keyTimes="0;0.9;1" dur="0.8s" repeatCount="indefinite"/></rect><g class="fade d6"><rect x="1100" y="56" width="110" height="26" rx="13" fill="#ef4444" fill-opacity=".15" stroke="#ef4444"/><text x="1155" y="74" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#ef4444">same rows</text></g></g>
</svg>
